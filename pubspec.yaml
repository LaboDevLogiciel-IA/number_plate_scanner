# Global definition.
name: license_plate_scanner
publish_to: "none"
version: 0.0.1
description:
  "This simple mobile application has been made to take
  a capture of an automobile with his number plate from
  device native camera and send it to a remote back-end
  server for his identification."

# SDK environment.
environment:
  sdk: ^3.10.4

# Project dev dependencies.
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Project dependencies.
dependencies:
  flutter:
    sdk: flutter
  flutter_widget_from_html_core: ^0.17.0
  permission_handler: ^12.0.1
  simple_animations: ^5.2.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3

# Project raw data.
flutter:
  uses-material-design: true
  # Icons and logos.
  assets:
    - assets/logos/launcher.png
  # Text fonts.
  fonts:
    - family: SanFrancisco
      fonts:
        - asset: assets/fonts/san_francisco.otf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/space_mono.ttf
